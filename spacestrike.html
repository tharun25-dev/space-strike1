<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Strike: Alien Invasion</title>
    <style>
        body {
            margin: 0;
            background-color: #05050e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            border: 2px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            background: #000;
        }
        #uiOverlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 5px #000;
        }
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        #gameOverScreen h1 { color: #ff0055; margin-bottom: 10px; }
        #restartBtn {
            padding: 10px 20px;
            font-size: 18px;
            background: #00f0ff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: #000;
            border-radius: 5px;
            margin-top: 15px;
        }
        #restartBtn:hover { background: #00b8cc; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="uiOverlay">
        <div>Score: <span id="scoreVal" style="color:#00f0ff;">0</span></div>
        <div>Multiplier: <span id="multVal" style="color:#ff0055;">1x</span></div>
        <div>Level: <span id="levelVal" style="color:#00ff66;">1</span></div>
    </div>
    <div id="gameOverScreen" class="hidden">
        <h1>GAME OVER</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <p>Reached Level: <span id="finalLevel">1</span></p>
        <button id="restartBtn" onclick="restartGame()">Play Again</button>
    </div>
    <canvas id="gameCanvas" width="600" height="700"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game State
let score = 0;
let kills = 0;
let level = 1;
let multiplier = 1;
let gameOver = false;

// Web Audio API Context setup (lazily initialized on first user click/interaction)
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

// Procedural Retro Sound Generators
function playLaserSound() {
    initAudio();
    if (!audioCtx) return;
    
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.15);
    
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
}

function playExplosionSound() {
    initAudio();
    if (!audioCtx) return;
    
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.3);
    
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}

function playLevelUpSound() {
    initAudio();
    if (!audioCtx) return;
    
    let now = audioCtx.currentTime;
    
    // Quick ascending notes
    [300, 450, 600, 900].forEach((freq, index) => {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, now + (index * 0.08));
        
        gain.gain.setValueAtTime(0.1, now + (index * 0.08));
        gain.gain.exponentialRampToValueAtTime(0.01, now + (index * 0.08) + 0.1);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start(now + (index * 0.08));
        osc.stop(now + (index * 0.08) + 0.1);
    });
}

function playGameOverSound() {
    initAudio();
    if (!audioCtx) return;
    
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.8);
    
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.8);
}

// Controls
const keys = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false, Space: false };

window.addEventListener('keydown', e => {
    initAudio(); // Resume or enable context via interaction safety rules
    if (e.code === 'Space') keys.Space = true;
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.ArrowLeft = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.ArrowRight = true;
    if (e.key === 'ArrowUp' || e.key === 'w') keys.ArrowUp = true;
    if (e.key === 'ArrowDown' || e.key === 's') keys.ArrowDown = true;
});

window.addEventListener('keyup', e => {
    if (e.code === 'Space') keys.Space = false;
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.ArrowLeft = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.ArrowRight = false;
    if (e.key === 'ArrowUp' || e.key === 'w') keys.ArrowUp = false;
    if (e.key === 'ArrowDown' || e.key === 's') keys.ArrowDown = false;
});

// Player Spacecraft (Moves in X and Y)
const player = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 80,
    width: 40,
    height: 40,
    speed: 5,
    lastShot: 0,
    shootDelay: 200 // ms
};

// Game Entities
let bullets = [];
let aliens = [];
let obstacles = [];

// Alien Types (Higher ranks have higher HP and color coding)
const ALIEN_TYPES = [
    { rank: 1, hp: 1, color: '#00ff66', baseScore: 10, speed: 2 },
    { rank: 2, hp: 2, color: '#ffcc00', baseScore: 20, speed: 2.3 },
    { rank: 3, hp: 3, color: '#ff0055', baseScore: 40, speed: 2.6 }
];

// Spawning Timers
let lastAlienSpawn = 0;
let lastObstacleSpawn = 0;

function spawnEntities(timestamp) {
    // Spawn Aliens
    if (timestamp - lastAlienSpawn > Math.max(800, 2000 - level * 100)) {
        const typeIndex = Math.min(Math.floor(Math.random() * (1 + level * 0.5)), ALIEN_TYPES.length - 1);
        const type = ALIEN_TYPES[typeIndex];
        aliens.push({
            x: Math.random() * (canvas.width - 40),
            y: -40,
            width: 40,
            height: 35,
            speed: type.speed + (level * 0.2), // Speed scales with level
            hp: type.hp,
            maxHp: type.hp,
            color: type.color,
            baseScore: type.baseScore
        });
        lastAlienSpawn = timestamp;
    }

    // Spawn Unbreakable Asteroid Obstacles
    if (timestamp - lastObstacleSpawn > Math.max(1500, 3500 - level * 150)) {
        obstacles.push({
            x: Math.random() * (canvas.width - 50),
            y: -50,
            width: 50,
            height: 50,
            speed: 1.5 + (level * 0.1) // Obstacles move strictly in Y direction
        });
        lastObstacleSpawn = timestamp;
    }
}

function update(timestamp) {
    if (gameOver) return;

    // Player Movement (X and Y limits)
    if (keys.ArrowLeft && player.x > 0) player.x -= player.speed;
    if (keys.ArrowRight && player.x < canvas.width - player.width) player.x += player.speed;
    if (keys.ArrowUp && player.y > 0) player.y -= player.speed;
    if (keys.ArrowDown && player.y < canvas.height - player.height) player.y += player.speed;

    // Player Shooting
    if (keys.Space && timestamp - player.lastShot > player.shootDelay) {
        bullets.push({
            x: player.x + player.width / 2 - 3,
            y: player.y,
            width: 6,
            height: 15,
            speed: 8
        });
        playLaserSound();
        player.lastShot = timestamp;
    }

    // Move Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        if (bullets[i].y < -10) bullets.splice(i, 1);
    }

    // Move Obstacles (Y Direction Only)
    for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.y += obs.speed;
        if (obs.y > canvas.height) {
            obstacles.splice(i, 1);
            continue;
        }

        // Player Collision with Obstacle
        if (checkCollision(player, obs)) {
            endGame();
            return;
        }
    }

    // Bullet-Obstacle Collision
    for (let bi = bullets.length - 1; bi >= 0; bi--) {
        for (let oi = 0; oi < obstacles.length; oi++) {
            if (checkCollision(bullets[bi], obstacles[oi])) {
                bullets.splice(bi, 1);
                break;
            }
        }
    }

    // Move Aliens (Y Direction Only) & Collisions
