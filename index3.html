<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Defender 2D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            border: 2px solid #00ffcc;
            border-radius: 4px;
        }

        canvas {
            display: block;
            background: radial-gradient(circle at center, #0a0a28 0%, #020208 100%);
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 15px;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.8);
        }

        .hud-item {
            background: rgba(0, 20, 40, 0.6);
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid #00ffcc;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        #game-over-screen h1 {
            color: #ff3366;
            font-size: 42px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff3366;
        }

        #game-over-screen p {
            font-size: 20px;
            margin: 5px 0;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #050510;
            background-color: #00ffcc;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px #00ffcc;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #ffffff;
            box-shadow: 0 0 25px #ffffff;
            transform: scale(1.05);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="600" height="750"></canvas>
    
    <div class="ui-layer">
        <div class="hud">
            <div class="hud-item">SCORE: <span id="score">0</span></div>
            <div class="hud-item">LEVEL: <span id="level">1</span></div>
            <div class="hud-item">MULTIPLIER: <span id="multiplier">1x</span></div>
        </div>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1>GAME OVER</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <p>Highest Level: <span id="final-level">1</span></p>
        <button id="restart-btn">PLAY AGAIN</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const multiplierEl = document.getElementById('multiplier');
const gameOverScreen = document.getElementById('game-over-screen');
const finalScoreEl = document.getElementById('final-score');
const finalLevelEl = document.getElementById('final-level');
const restartBtn = document.getElementById('restart-btn');

// Game State Variables
let score = 0;
let level = 1;
let multiplier = 1;
let aliensDestroyedTotal = 0;
let gameOver = false;
let baseSpeed = 2;
let spawnRate = 120; // Frames between spawns
let frameCount = 0;

// Input Handler
const keys = {
    ArrowLeft: false,
    ArrowRight: false,
    ArrowUp: false,
    ArrowDown: false,
    KeyA: false,
    KeyD: false,
    KeyW: false,
    KeyS: false,
    Space: false
};

window.addEventListener('keydown', e => {
    if (e.code in keys) keys[e.code] = true;
});

window.addEventListener('keyup', e => {
    if (e.code in keys) keys[e.code] = false;
});

// Player Setup
class Player {
    constructor() {
        this.width = 40;
        this.height = 40;
        this.x = canvas.width / 2 - this.width / 2;
        this.y = canvas.height - 80;
        this.speed = 6;
        this.cooldown = 0;
    }

    draw() {
        // Player Ship Vector Design
        ctx.fillStyle = '#00ffcc';
        ctx.beginPath();
        ctx.moveTo(this.x + this.width / 2, this.y);
        ctx.lineTo(this.x + this.width, this.y + this.height);
        ctx.lineTo(this.x + this.width * 0.8, this.y + this.height * 0.8);
        ctx.lineTo(this.x + this.width * 0.2, this.y + this.height * 0.8);
        ctx.lineTo(this.x, this.y + this.height);
        ctx.closePath();
        ctx.fill();

        // Thruster engine flame
        ctx.fillStyle = '#ff6600';
        ctx.beginPath();
        ctx.moveTo(this.x + this.width * 0.35, this.y + this.height * 0.8);
        ctx.lineTo(this.x + this.width * 0.5, this.y + this.height + Math.random() * 10);
        ctx.lineTo(this.x + this.width * 0.65, this.y + this.height * 0.8);
        ctx.closePath();
        ctx.fill();
    }

    update() {
        // Movement in X and Y Directions
        if ((keys.ArrowLeft || keys.KeyA) && this.x > 0) this.x -= this.speed;
        if ((keys.ArrowRight || keys.KeyD) && this.x < canvas.width - this.width) this.x += this.speed;
        if ((keys.ArrowUp || keys.KeyW) && this.y > 0) this.y -= this.speed;
        if ((keys.ArrowDown || keys.KeyS) && this.y < canvas.height - this.height) this.y += this.speed;

        // Shooting Mechanism
        if (keys.Space && this.cooldown <= 0) {
            bullets.push(new Bullet(this.x + this.width / 2, this.y));
            this.cooldown = 12; // Frames between shots
        }
        if (this.cooldown > 0) this.cooldown--;
    }
}

// Laser Bullet Setup
class Bullet {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 4;
        this.speed = 10;
    }

    draw() {
        ctx.fillStyle = '#ff0055';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff0055';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0; // Reset blur
    }

    update() {
        this.y -= this.speed;
    }
}

// Alien Entity (Moves in Y only)
class Alien {
    constructor(x, rank) {
        this.x = x;
        this.y = -40;
        this.width = 36;
        this.height = 36;
        this.rank = rank; // 1 to 3
        this.hp = rank;
        this.maxHp = rank;
        this.speed = baseSpeed + (rank * 0.3);
        
        // Colors by Rank
        this.colors = ['#33ff33', '#ff9900', '#ff00ff'];
    }

    draw() {
        ctx.fillStyle = this.colors[this.rank - 1];
        
        // Render Alien Core Shape based on Rank
        ctx.beginPath();
        if (this.rank === 1) {
            ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width/2, 0, Math.PI * 2);
        } else if (this.rank === 2) {
            ctx.fillRect(this.x, this.y, this.width, this.height);
        } else {
            // Hexagon for Elite Rank 3
            const cx = this.x + this.width/2;
            const cy = this.y + this.height/2;
            const r = this.width/2;
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i;
                const px = cx + r * Math.cos(angle);
                const py = cy + r * Math.sin(angle);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
        }
        ctx.fill();

        // Draw Health Indicator for Multi-HP Aliens
        if (this.maxHp > 1) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(this.x, this.y - 8, this.width * (this.hp / this.maxHp), 4);
        }
    }

    update() {
        this.y += this.speed;
    }
}

// Unbreakable Obstacle Entity (Moves in Y only)
class Obstacle {
    constructor(x) {
        this.x = x;
        this.y = -50;
        this.width = 45;
        this.height = 45;
        this.speed = baseSpeed * 0.9;
    }

    draw() {
        ctx.fillStyle = '#667788';
        ctx.strokeStyle = '#aabbcc';
        ctx.lineWidth = 3;
        ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.strokeRect(this.x, this.y, this.width, this.height);
        
        // X pattern to signify invulnerability
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x + this.width, this.y + this.height);
        ctx.moveTo(this.x + this.width, this.y);
        ctx.lineTo(this.x, this.y + this.height);
        ctx.stroke();
    }

    update() {
        this.y += this.speed;
    }
}

// Global Entities Arrays
let player = new Player();
let bullets = [];
let aliens = [];
let obstacles = [];

function spawnEntities() {
    frameCount++;
    if (frameCount % Math.max(30, Math.floor(spawnRate)) === 0) {
        const xPos = Math.random() * (canvas.width - 50);
        
        // 30% chance to spawn an invulnerable obstacle, 70% chance to spawn an Alien
        if (Math.random() < 0.3) {
            obstacles.push(new Obstacle(xPos));
        } else {
            // Alien rank weight increases based on player level
            let rank = 1;
            const rand = Math.random();
            if (level >= 3 && rand > 0.6) rank = 3;
            else if (level >= 2 && rand > 0.4) rank = 2;
            
            aliens.push(new Alien(xPos, rank));
        }
    }
}

function checkCollisions() {
    // 1. Bullets hitting Entities
    for (let bIndex = bullets.length - 1; bIndex >= 0; bIndex--) {
        const b = bullets[bIndex];

        // Bullets hitting Obstacles -> Bullet destroyed, Obstacle unharmed
        for (let oIndex = 0; oIndex < obstacles.length; oIndex++) {
            const o = obstacles[oIndex];
            if (b.x > o.x && b.x < o.x + o.width && b.y > o.y && b.y < o.y + o.height) {
                bullets.splice(bIndex, 1);
                return;
            }
        }

        // Bullets hitting Aliens
        for (let aIndex = aliens.length - 1; aIndex >= 0; aIndex--) {
            const a = aliens[aIndex];
            if (b.x > a.x && b.x < a.x + a.width && b.y > a.y && b.y < a.y + a.height) {
                bullets.splice(bIndex, 1);
                a.hp--;

                if (a.hp <= 0) {
                    aliens.splice(aIndex, 1);
                    score += 100 * a.rank * multiplier;
                    aliensDestroyedTotal++;

                    // Progression: Level up every 5 destroyed aliens
                    if (aliensDestroyedTotal % 5 === 0) {
                        level++;
                        multiplier *= 2; // Double score multiplier
                        baseSpeed += 0.5; // Escalating movement speed
                        spawnRate *= 0.85; // Faster spawns
                    }

                    // Update UI
                    scoreEl.innerText = score;
                    levelEl.innerText = level;
                    multiplierEl.innerText = multiplier + 'x';
                }
                break;
            }
        }
    }

    // 2. Player colliding with Aliens or Obstacles -> Game Over
    const targets = [...aliens, ...obstacles];
    for (let t of targets) {
        if (
            player.x < t.x + t.width &&
            player.x + player.width > t.x &&
            player.y < t.y + t.height &&
            player.y + player.height > t.y
        ) {
            triggerGameOver();
        }
    }
}

function triggerGameOver() {
    gameOver = true;
    finalScoreEl.innerText = score;
    finalLevelEl.innerText = level;
    gameOverScreen.classList.remove('hidden');
}

function resetGame() {
    score = 0;
    level = 1;
    multiplier = 1;
    aliensDestroyedTotal = 0;
    baseSpeed = 2;
    spawnRate = 120;
    frameCount = 0;
    gameOver = false;

    scoreEl.innerText = '0';
    levelEl.innerText = '1';
    multiplierEl.innerText = '1x';

    player = new Player();
    bullets = [];
    aliens = [];
    obstacles = [];

    gameOverScreen.classList.add('hidden');
    animate();
}

function animate() {
    if (gameOver) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Update & Render Player
    player.update();
    player.draw();

    // Update & Render Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].update();
        bullets[i].draw();
        if (bullets[i].y < 0) bullets.splice(i, 1);
    }

    // Update & Render Aliens (Move in Y)
    for (let i = aliens.length - 1; i >= 0; i--) {
        aliens[i].update();
        aliens[i].draw();
        if (aliens[i].y > canvas.height) aliens.splice(i, 1);
    }

    // Update & Render Obstacles (Move in Y)
    for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].update();
        obstacles[i].draw();
        if (obstacles[i].y > canvas.height) obstacles.splice(i, 1);
    }

    spawnEntities();
    checkCollisions();

    requestAnimationFrame(animate);
}

// Start Game Loop & Setup Event Listeners
restartBtn.addEventListener('click', resetGame);
animate();

</script>
</body>
</html>
